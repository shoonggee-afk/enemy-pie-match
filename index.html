<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enemy Pie Story Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: comic strip down the left (picture + empty story slot per row), story-card tray on the right; tray becomes a sticky bottom drawer on narrow tablets. */
:root{
  --sky:#eaf2fa; --sheet:#ffffff; --ink:#1f2a3a; --muted:#5b6678; --line:#cfd9e6;
  --shirt:#2f5fb3; --shirt-soft:#dfe8f8; --cap:#d1453b; --cap-soft:#fbe3e0;
  --grass:#2e8f55; --grass-soft:#dcf1e3; --pie:#c98a12; --pie-soft:#fbf0d6;
  --shadow:0 2px 0 rgba(31,42,58,.12);
  --display:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#121821; --sheet:#1c2430; --ink:#e8edf4; --muted:#a3afc0; --line:#334156;
  --shirt:#8fb0f2; --shirt-soft:#1f2d48; --cap:#f08a80; --cap-soft:#3a2020;
  --grass:#6fd39a; --grass-soft:#173226; --pie:#f0bf5a; --pie-soft:#352a12; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#121821; --sheet:#1c2430; --ink:#e8edf4; --muted:#a3afc0; --line:#334156;
  --shirt:#8fb0f2; --shirt-soft:#1f2d48; --cap:#f08a80; --cap-soft:#3a2020;
  --grass:#6fd39a; --grass-soft:#173226; --pie:#f0bf5a; --pie-soft:#352a12; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.card:focus-visible,.slot:focus-visible{outline:3px solid var(--shirt);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sky);border-bottom:2px solid var(--line);padding-inline:16px;padding-block:10px}
.top-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand b{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:.01em}
.brand span{font-size:.8rem;color:var(--muted);font-weight:600}
.group{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.group input{width:4.2em;font:inherit;font-weight:700;text-align:center;padding:6px 4px;border-radius:10px;border:2px solid var(--line);background:var(--sheet);color:var(--ink)}
.modes{display:flex;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:3px}
.modes button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--shirt);color:var(--sheet)}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--sheet);border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn[aria-pressed="true"]{background:var(--pie-soft);border-color:var(--pie)}
.status{font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);min-width:7.5em}

.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.how{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
.how b{color:var(--ink)}

.board{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:stretch;background:var(--sheet);border:2px solid var(--line);border-radius:16px;padding:10px}
.pic{position:relative;border:0;padding:0;background:none;cursor:zoom-in;border-radius:10px;overflow:hidden;align-self:start}
.pic img{display:block;width:150px;height:auto;border-radius:10px;border:2px solid var(--ink)}
.pic .no{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--sheet);font-family:var(--display);font-size:1.25rem;line-height:1;padding:4px 9px 3px;border-radius:9px}
.numonly{display:none;width:150px;min-height:90px;border:2px dashed var(--line);border-radius:10px;align-items:center;justify-content:center;font-family:var(--display);font-size:2.6rem;color:var(--muted)}
body.order .pic{display:none}
body.order .numonly{display:flex}
body.order .row{grid-template-columns:90px minmax(0,1fr)}
body.order .numonly{width:90px}

.slot{min-height:110px;border:2.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer;transition:border-color .15s,background .15s}
.slot .empty{color:var(--muted);font-weight:700;text-align:center;font-size:.92rem}
body.picking .slot{border-color:var(--shirt);background:var(--shirt-soft)}
.slot.over{border-color:var(--shirt);border-style:solid;background:var(--shirt-soft)}
.slot.filled{border-style:solid;border-color:var(--line);background:transparent;justify-content:flex-start}
.slot.ok{border-color:var(--grass);background:var(--grass-soft)}
.slot.bad{border-color:var(--cap);background:var(--cap-soft)}
.mark{font-weight:800;font-size:.85rem}
.slot.ok .mark{color:var(--grass)}
.slot.bad .mark{color:var(--cap)}
.hintline{display:none;font-size:.82rem;font-weight:700;color:var(--pie)}
body.hints .hintline{display:block}

.gap{display:flex;align-items:center;gap:12px;border:2.5px dashed var(--pie);background:var(--pie-soft);border-radius:16px;padding:12px 14px}
.gap .q{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--pie)}
.gap p{margin:0;font-weight:700}
.gap small{display:block;font-weight:600;color:var(--muted)}

.tray{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);max-height:calc(100vh - 110px);overflow:auto;background:var(--sheet);border:2px solid var(--ink);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);overscroll-behavior:contain}
.tray h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tray h2 small{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px}
.done-msg{display:none;text-align:center;font-weight:700;color:var(--muted);padding:14px 6px}
.tray.emptied .done-msg{display:block}

.card{position:relative;background:var(--sheet);border:2px solid var(--ink);border-radius:12px;padding:10px 12px 10px 44px;font-size:.95rem;line-height:1.5;cursor:grab;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.card .tag{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;background:var(--pie-soft);color:var(--pie);border:2px solid var(--pie);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.card.sel{border-color:var(--shirt);box-shadow:0 0 0 3px var(--shirt-soft),var(--shadow);background:var(--shirt-soft)}
.card.dragging{opacity:.35}
.slot .card{box-shadow:none;padding:40px 12px 10px 12px}
.slot .card .back{top:8px;right:8px;border:1.5px solid var(--line);background:var(--sheet)}
.card .back{position:absolute;right:6px;top:6px;border:0;background:transparent;color:var(--muted);font-size:.78rem;font-weight:800;cursor:pointer;padding:4px 6px;border-radius:6px}
.tray .card .back{display:none}
.drag-ghost{position:fixed;z-index:60;pointer-events:none;width:300px;max-height:180px;overflow:hidden;opacity:.92;transform:rotate(-2deg);cursor:grabbing}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.overlay{position:fixed;inset:0;z-index:80;background:rgba(15,20,30,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:min(92vw,620px);max-height:86vh;border-radius:14px;border:3px solid #fff;display:block}
.win{background:var(--sheet);color:var(--ink);border:3px solid var(--ink);border-radius:22px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 0 rgba(0,0,0,.2);max-height:90vh;overflow:auto}
.win h3{margin:0;font-family:var(--display);font-weight:400;font-size:2.3rem;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sky);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.mission{border:2.5px dashed var(--pie);background:var(--pie-soft);border-radius:14px;padding:12px 14px}
.mission p{margin:0}
.win .row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--sheet);font-weight:800;padding:10px 18px;border-radius:999px;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:960px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .tray{position:sticky;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:38vh;border-radius:18px}
  .tray.emptied{max-height:none}
}
@media (max-width:600px){
  .row{grid-template-columns:96px minmax(0,1fr);padding:8px;gap:8px}
  .pic img{width:96px}
  body.order .row{grid-template-columns:64px minmax(0,1fr)}
  body.order .numonly{width:64px}
  .brand b{font-size:1.6rem}
  .card{font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){.shake{animation:none}*{transition:none!important}}
</style>

<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>Enemy Pie · Story Match</b><span>Match each story card to its picture</span></div>
    <label class="group" for="group">Group <input id="group" inputmode="numeric" maxlength="3" placeholder="#"></label>
    <div class="modes" role="group" aria-label="Game mode">
      <button type="button" id="m-pic" aria-pressed="true">Picture Match</button>
      <button type="button" id="m-order" aria-pressed="false">Story Order</button>
    </div>
    <div class="actions">
      <span class="status" id="status">0 / 8 placed</span>
      <button type="button" class="btn ghost" id="hint" aria-pressed="false">Hint</button>
      <button type="button" class="btn ghost" id="reset">Reset</button>
      <button type="button" class="btn primary" id="check">Check</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="how" id="how">
    <span><b>1.</b> Tap a story card.</span>
    <span><b>2.</b> Tap the picture box where it belongs.</span>
    <span><b>3.</b> Press <b>Check</b>. Green = correct, red = try again.</span>
    <span>Tap a picture to see it bigger.</span>
  </div>
  <main class="board" id="board" aria-label="Comic pictures"></main>
  <aside class="tray" id="tray" aria-label="Story cards">
    <h2>Story cards <small id="left">8 left</small></h2>
    <div class="cards" id="cards"></div>
    <div class="done-msg">All cards are placed. Press <b>Check</b>!</div>
  </aside>
</div>

var STORY = [
  {id:1, hint:"baseball game", text:"It was all good until Jeremy Ross moved into the neighborhood, right next door to my best friend Stanley. I did not like Jeremy Ross. He laughed at me when he struck me out in a baseball game."},
  {id:2, hint:"trampoline party", text:"He had a party on his trampoline, and I wasn’t even invited. But my best friend Stanley was."},
  {id:3, hint:"enemy list · tree house", text:"Jeremy Ross was the one and only person on my enemy list. I never even had an enemy list until he moved into the neighborhood. But as soon as he came along, I needed one. I hung it up in my tree house, where Jeremy Ross was not allowed to go."},
  {id:4, hint:"old recipe book", text:"Dad understood stuff like enemies. He told me that when he was my age, he had enemies, too. But he knew of a way to get rid of them. I asked him to tell me how. “Tell you how? I’ll show you how!” he said. He pulled a really old recipe book off the kitchen shelf. Inside, there was a worn-out scrap of paper with faded writing. Dad held it up and squinted at it. “Enemy Pie.” he said, satisfied. You may be wondering what exactly is in Enemy Pie. I was wondering, too. But Dad said the recipe was so secret, he couldn’t even tell me. I decided it must be magic."},
  {id:5, hint:"weeds · earthworms · gum", text:"I begged him to tell me something—anything. “I will tell you this,” he said. “Enemy Pie is the fastest known way to get rid of enemies.” Now, of course, this got my mind working. What kinds of things — disgusting things — would I put into a pie for an enemy? I brought Dad some weeds from the garden, but he just shook his head. I brought him earthworms and rocks, but he didn’t think he’d need those. I gave him the gum I’d been chewing on all morning. He gave it right back to me."},
  {id:6, hint:"alone · ball · boomerang", text:"I went out to play, alone. I shot baskets until the ball got stuck on the roof. I threw a boomerang that never came back to me. And all the while, I listened to the sounds of my dad chopping and stirring and blending the ingredients of Enemy Pie. This could be a great summer after all."},
  {id:7, hint:"delicious · after dessert", text:"Enemy Pie was delicious! After dessert, Jeremy rode his bike home but not before inviting me over to play on his trampoline in the morning. He said he’d teach me how to flip."},
  {id:8, hint:"my best enemy", text:"As for Enemy Pie, I still don’t know how to make it. I still wonder if enemies really do hate it or if their hair falls out or their breath turns bad. But I don’t know if I’ll ever get an answer, because I just lost my best enemy."}
];
var LETTERS = "ABCDEFGH";

var state;
function fresh(){
  var order = STORY.map(function(s){return s.id;});
  for (var i = order.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = order[i]; order[i] = order[j]; order[j] = t; }
  var letter = {}; order.forEach(function(id, i){ letter[id] = LETTERS[i]; });
  return {tray: order, slots: {}, letter: letter, sel: null, checks: 0, hints: false, hintUsed: false, start: Date.now(), result: {}, done: false};
}

var board = document.getElementById('board');
var cardsEl = document.getElementById('cards');
var trayEl = document.getElementById('tray');

function storyById(id){ for (var i = 0; i < STORY.length; i++) if (STORY[i].id === id) return STORY[i]; }

function cardHTML(id){
  var s = storyById(id);
  return '<div class="card' + (state.sel === id ? ' sel' : '') + '" data-card="' + id + '" tabindex="0" role="button" aria-label="Story card ' + state.letter[id] + '">' +
    '<span class="tag">' + state.letter[id] + '</span>' +
    '<button type="button" class="back" data-back="' + id + '" aria-label="Move card back">↩ back</button>' +
    s.text + '</div>';
}

function render(){
  var html = '';
  for (var n = 1; n <= 8; n++){
    var cid = state.slots[n];
    var res = state.result[n];
    var cls = 'slot' + (cid ? ' filled' : '') + (res === true ? ' ok' : res === false ? ' bad' : '');
    var mark = res === true ? '<span class="mark">✔ Correct!</span>' : res === false ? '<span class="mark">✖ Not this one. Try another card.</span>' : '';
    html += '<section class="row">' +
      '<button type="button" class="pic" data-zoom="' + n + '" aria-label="Show picture ' + n + ' bigger"><img src="' + IMGS[n] + '" alt="Comic picture ' + n + '"><span class="no">' + n + '</span></button>' +
      '<div class="numonly" aria-hidden="true">' + n + '</div>' +
      '<div class="' + cls + '" data-slot="' + n + '" tabindex="0" role="button" aria-label="Box for picture ' + n + '">' +
        '<span class="hintline">Hint: ' + storyById(n).hint + '</span>' + mark +
        (cid ? cardHTML(cid) : '<span class="empty">Put a story card here</span>') +
      '</div></section>';
    if (n === 6){
      html += '<div class="gap" aria-label="Missing part"><span class="q">?</span><p>Something is missing here!<small>The story skips a part between picture 6 and picture 7.</small></p></div>';
    }
  }
  board.innerHTML = html;
  cardsEl.innerHTML = state.tray.map(cardHTML).join('');
  var placed = 8 - state.tray.length;
  document.getElementById('status').textContent = placed + ' / 8 placed';
  document.getElementById('left').textContent = state.tray.length + ' left';
  trayEl.classList.toggle('emptied', state.tray.length === 0);
  document.body.classList.toggle('picking', state.sel !== null);
  document.body.classList.toggle('hints', state.hints);
  document.getElementById('hint').setAttribute('aria-pressed', state.hints ? 'true' : 'false');
}

function whereIs(id){
  if (state.tray.indexOf(id) >= 0) return 'tray';
  for (var k in state.slots) if (state.slots[k] === id) return +k;
  return null;
}
function removeCard(id){
  var w = whereIs(id);
  if (w === 'tray') state.tray.splice(state.tray.indexOf(id), 1);
  else if (w !== null) delete state.slots[w];
  return w;
}
function placeInSlot(id, n){
  if (state.slots[n] === id){ state.sel = null; render(); return; }
  var from = removeCard(id);
  var other = state.slots[n];
  if (other){
    if (from === 'tray' || from === null) state.tray.push(other);
    else state.slots[from] = other;
    delete state.result[from];
  }
  state.slots[n] = id;
  delete state.result[n];
  state.sel = null;
  render();
}
function backToTray(id){
  var from = removeCard(id);
  if (from !== null && from !== 'tray') delete state.result[from];
  state.tray.push(id);
  state.sel = null;
  render();
}

function onCardTap(id){
  if (state.sel === id){ state.sel = null; render(); return; }
  var w = whereIs(id);
  if (state.sel !== null && typeof w === 'number'){ placeInSlot(state.sel, w); return; }
  state.sel = id; render();
}

document.addEventListener('click', function(e){
  if (suppressClick){ suppressClick = false; return; }
  var back = e.target.closest('[data-back]');
  if (back){ e.stopPropagation(); backToTray(+back.dataset.back); return; }
  var zoom = e.target.closest('[data-zoom]');
  if (zoom){ openZoom(+zoom.dataset.zoom); return; }
  var card = e.target.closest('[data-card]');
  if (card){ onCardTap(+card.dataset.card); return; }
  var slot = e.target.closest('[data-slot]');
  if (slot){
    if (state.sel !== null) placeInSlot(state.sel, +slot.dataset.slot);
    else toast('First, tap a story card.');
    return;
  }
  if (e.target.closest('#tray') && state.sel !== null && typeof whereIs(state.sel) === 'number'){ backToTray(state.sel); }
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-card],[data-slot]')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape'){ closeOverlay(); if (state.sel !== null){ state.sel = null; render(); } }
});

/* drag: mouse and pen can drag cards; on touch screens, tap a card and then tap a box */
var drag = null, suppressClick = false;
document.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'touch') return;
  var card = e.target.closest('[data-card]');
  if (!card || e.target.closest('[data-back]')) return;
  drag = {id: +card.dataset.card, x: e.clientX, y: e.clientY, active: false, el: card};
});
document.addEventListener('pointermove', function(e){
  if (!drag) return;
  if (!drag.active){
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 8) startDrag(e.clientX, e.clientY); else return;
  }
  moveGhost(e.clientX, e.clientY);
});
document.addEventListener('pointerup', function(e){
  if (!drag) return;
  if (drag.active){
    suppressClick = true;
    setTimeout(function(){ suppressClick = false; }, 50);
    var under = document.elementFromPoint(e.clientX, e.clientY);
    endDrag();
    var slot = under && under.closest('[data-slot]');
    var id = drag.id; drag = null;
    if (slot) placeInSlot(id, +slot.dataset.slot);
    else if (under && under.closest('#tray')) backToTray(id);
    else render();
    return;
  }
  drag = null;
});
document.addEventListener('pointercancel', function(){ if (drag){ if (drag.active) endDrag(); drag = null; render(); } });

var ghost = null, lastOver = null;
function startDrag(x, y){
  drag.active = true;
  ghost = drag.el.cloneNode(true);
  ghost.classList.add('drag-ghost'); ghost.classList.remove('sel');
  document.body.appendChild(ghost);
  drag.el.classList.add('dragging');
  state.sel = null; document.body.classList.add('picking');
  moveGhost(x, y);
}
function moveGhost(x, y){
  if (!ghost) return;
  ghost.style.left = (x - 40) + 'px'; ghost.style.top = (y - 24) + 'px';
  var under = document.elementFromPoint(x, y);
  var slot = under && under.closest('[data-slot]');
  if (lastOver && lastOver !== slot) lastOver.classList.remove('over');
  if (slot) slot.classList.add('over');
  lastOver = slot;
}
function endDrag(){
  if (ghost){ ghost.remove(); ghost = null; }
  if (lastOver){ lastOver.classList.remove('over'); lastOver = null; }
  document.body.classList.remove('picking');
}

/* buttons */
document.getElementById('check').addEventListener('click', function(){
  var filled = Object.keys(state.slots).length;
  if (filled === 0){ toast('Put some cards in the boxes first.'); return; }
  state.checks++;
  var right = 0;
  for (var n = 1; n <= 8; n++){
    if (state.slots[n]){ state.result[n] = state.slots[n] === n; if (state.result[n]) right++; }
  }
  state.sel = null;
  render();
  document.querySelectorAll('.slot.bad').forEach(function(s){ s.classList.add('shake'); });
  if (right === 8){ setTimeout(showWin, 450); }
  else toast(right + ' correct' + (filled < 8 ? ' · ' + (8 - filled) + ' boxes still empty' : '') + '. Keep going!');
});
document.getElementById('hint').addEventListener('click', function(){
  state.hints = !state.hints; if (state.hints) state.hintUsed = true; render();
});
document.getElementById('reset').addEventListener('click', function(){
  var b = this;
  if (b.dataset.armed){ state = fresh(); delete b.dataset.armed; b.textContent = 'Reset'; render(); toast('New game! Cards are shuffled.'); return; }
  b.dataset.armed = '1'; b.textContent = 'Sure?';
  setTimeout(function(){ delete b.dataset.armed; b.textContent = 'Reset'; }, 2500);
});
function setMode(order){
  document.body.classList.toggle('order', order);
  document.getElementById('m-pic').setAttribute('aria-pressed', order ? 'false' : 'true');
  document.getElementById('m-order').setAttribute('aria-pressed', order ? 'true' : 'false');
  document.querySelector('.brand span').textContent = order ? 'Put the story cards in the right order (no pictures!)' : 'Match each story card to its picture';
}
document.getElementById('m-pic').addEventListener('click', function(){ setMode(false); });
document.getElementById('m-order').addEventListener('click', function(){ setMode(true); });

/* overlays */
var overlay = null;
function closeOverlay(){ if (overlay){ overlay.remove(); overlay = null; } }
function openZoom(n){
  closeOverlay();
  overlay = document.createElement('div');
  overlay.className = 'overlay lightbox';
  overlay.innerHTML = '<img src="' + IMGS[n] + '" alt="Comic picture ' + n + ', large">';
  overlay.addEventListener('click', closeOverlay);
  document.body.appendChild(overlay);
}
function showWin(){
  var secs = Math.round((Date.now() - state.start) / 1000);
  var t = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  var g = document.getElementById('group').value.trim();
  closeOverlay();
  overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = '<div class="win" role="dialog" aria-modal="true" aria-labelledby="wt">' +
    '<h3 id="wt">' + (g ? 'Great job, Group ' + g.replace(/[<>&"]/g, '') + '!' : 'Great job!') + '</h3>' +
    '<p style="margin:0">You matched all 8 parts of the story.</p>' +
    '<div class="stats"><div class="stat"><b>' + t + '</b><span>time</span></div><div class="stat"><b>' + state.checks + '</b><span>checks</span></div><div class="stat"><b>' + (state.hintUsed ? 'Yes' : 'No') + '</b><span>hints used</span></div></div>' +
    '<div class="mission"><p><b>Next mission ✍️</b></p><p>In picture 6, the boy played <b>alone</b>. In picture 7, he ate Enemy Pie <b>with Jeremy</b>! What happened in between? Talk with your group.</p></div>' +
    '<div class="row-btns"><button type="button" class="btn ghost" id="w-close">Close</button><button type="button" class="btn primary" id="w-again">Play again</button></div></div>';
  document.body.appendChild(overlay);
  document.getElementById('w-close').addEventListener('click', closeOverlay);
  document.getElementById('w-again').addEventListener('click', function(){ closeOverlay(); state = fresh(); render(); });
}
var toastTimer = null;
function toast(msg){
  var el = document.querySelector('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.remove(); }, 2200);
}

state = fresh();
render();
</script>

</body>
</html>
